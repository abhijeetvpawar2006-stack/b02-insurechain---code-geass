<style>

.lbs{display:flex;gap:10px;align-items:center;font-weight:500;color:#fff;white-space:nowrap}.lbs span{color:#93A1B8;font-weight:400}.pulse{width:9px;height:9px;border-radius:50%;background:#93A1B8;flex-shrink:0}.lbs.ok .pulse{background:#3DD598;box-shadow:0 0 0 0 #3DD59888;animation:pl 2.4s infinite}.lbs.bad .pulse{background:#FF7A6E}.lbs.bad{color:#FF9A90}

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
/* ===== tamper-evident audit chain ===== */
const canon=e=>JSON.stringify([e.seq,e.ts,e.actor,e.role,e.action,e.outcome,e.claimId,e.detail,e.prev]);
async function audit(action,outcome,claimId,detail){const l=S.audit[S.audit.length-1];const e={seq:S.audit.length+1,ts:new Date().toISOString(),actor:user.name,role:user.role,action,outcome,claimId:claimId||null,detail,prev:l?l.hash:Z};e.hash=await sha(canon(e));S.audit.push(e);store.set('ic_ckpt2',{seq:e.seq,hash:e.hash});save()}

/* ===== deterministic eligibility (explicit rules, fixed precedence) ===== */
const dd=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5),nm=s=>String(s).trim().toLowerCase();
function evalElig(c,p){const d=dd(c.incidentDate,c.filedAt),R=[];
R.push({id:'COVERAGE_PERIOD',label:'Incident within policy term',st:c.incidentDate>=p.effective&&c.incidentDate<=p.expiry?'pass':'fail',detail:`Incident ${c.incidentDate}; policy term ${p.effective} to ${p.expiry}`});
R.push({id:'FILING_WINDOW',label:'Filed within filing window',st:d<=p.window?'pass':'fail',detail:`Filed ${d} day(s) after the incident; window is ${p.window} days`+(d>p.window?` (${d-p.window} days late)`:'')});
const ex=p.exclusions.find(x=>nm(x)===nm(c.category));
R.push({id:'EXCLUDED_CATEGORY',label:'Category not excluded',st:ex?'fail':'pass',detail:ex?`Category "${c.category}" is excluded by this policy`:`"${c.category}" is not an excluded category`});
R.push({id:'COVERAGE_LIMIT',label:'Amount within coverage limit',st:c.amount>p.limit?'cap':'pass',detail:`Claimed ${inr(c.amount)}; coverage limit ${inr(p.limit)}`+(c.amount>p.limit?` — payable amount capped at the limit`:'')});
const f=R.find(r=>r.st==='fail');
if(f)return{outcome:'INELIGIBLE',determining:f.id,payable:0,rules:R,why:`Ineligible — determined by rule ${f.id}: ${f.detail}`};
if(c.amount>p.limit)return{outcome:'ELIGIBLE_CAPPED',determining:'COVERAGE_LIMIT',payable:p.limit,rules:R,why:`Eligible with cap — rule COVERAGE_LIMIT: payable ${inr(p.limit)} of ${inr(c.amount)} claimed`};
return{outcome:'ELIGIBLE',determining:'ALL_RULES_PASSED',payable:c.amount,rules:R,why:'Eligible — all rules passed; full amount payable'}}
/* ===== duplicate detection ===== */
function findDup(c){for(const x of S.claims){if(x.policyId!==c.policyId||x.id===c.id)continue;
if(x.incidentDate===c.incidentDate&&nm(x.category)===nm(c.category))return{of:x.id,res:null,reason:`Same policy, incident date and category as ${x.id}`+(nm(x.ref)!==nm(c.ref)?` — despite a different reference (${x.ref} vs ${c.ref})`:'')};
const sh=c.evidence.find(e=>x.evidence.some(y=>nm(y)===nm(e)));if(sh&&Math.abs(dd(x.incidentDate,c.incidentDate))<=3)return{of:x.id,res:null,reason:`Shares evidence ${sh} with ${x.id} and incident dates are within 3 days`}}return null}
/* ===== advisory narrative analysis — never changes eligibility or state ===== */
const MO=['january','february','march','april','may','june','july','august','september','october','november','december'],MS=MO.join('|');
function analyze(c,p){const t=c.narrative,tl=t.toLowerCase(),f=[],dt=[];
for(const m of t.matchAll(new RegExp('(\\d{1,2})(?:st|nd|rd|th)?\\s+('+MS+')','gi')))dt.push({q:m[0],mo:MO.indexOf(m[2].toLowerCase())+1,d:+m[1]});
for(const m of t.matchAll(new RegExp('('+MS+')\\s+(\\d{1,2})','gi')))dt.push({q:m[0],mo:MO.indexOf(m[1].toLowerCase())+1,d:+m[2]});

function check(c,to,reason){const u=user;
if(u.role==='Auditor')return'Auditors have read-only access.';
if(u.role==='Submitter')return'Submitters cannot make workflow decisions.';
const t=TR.find(x=>x.from===c.status&&x.to===to);
if(!t){if(c.status===to)return`The claim is already ${to}.`;
if(c.status==='REJECTED'||c.status==='PAID')return`${c.status} is a final state; no further transitions are allowed.`;
if(ORDER.indexOf(to)>ORDER.indexOf(c.status)+1||(to==='REJECTED'&&c.status==='SUBMITTED'))return`Skipping a state is not allowed: a ${c.status} claim must first move to ${TR.find(x=>x.from===c.status).to}.`;
return`Transition ${c.status} → ${to} is not permitted.`}
if(!t.roles.includes(u.role))return`Role ${u.role} may not perform ${c.status} → ${to}.`;
if(to==='REJECTED'&&!reason)return'A written reason is required to reject a claim.';
if(to==='APPROVED'){if(c.elig.outcome==='INELIGIBLE')return`Claim is ineligible under rule ${c.elig.determining}; it can only be rejected.`;
if(c.dup&&!c.dup.res)return'Resolve the duplicate flag before approval.';if(c.dup&&c.dup.res==='CONFIRMED')return'Confirmed duplicate; it can only be rejected.';
if(c.elig.payable>ADJ&&u.role!=='Supervisor')return`Payable amount ${inr(c.elig.payable)} exceeds Adjuster authority of ${inr(ADJ)}; a Supervisor must approve.`}
if(to==='PAID'){if(c.paid)return'This claim has already been paid.';if(c.dup&&c.dup.res!=='DISTINCT')return'Duplicate flag not cleared; payment is blocked.'}

<section id="r6"><h2>Identity checks</h2><p>Each claim carries an ID type, a number, the name printed on it, an expiry date where the document has one, and a photo of the document. The checks are rules, so the same input always gives the same result.</p><div class="rule"><b>Number format</b><span>Aadhaar has 12 digits, PAN is five letters, four digits and a letter, a driving licence follows the state, year and serial pattern, and a Voter ID is three letters and seven digits.</span></div><div class="rule"><b>Check digit</b><span>Aadhaar numbers must pass the Verhoeff check digit. PAN must show an individual holder.</span></div><div class="rule"><b>Name match</b><span>The name on the ID must match the policyholder. Below the supervisor-set minimum it needs review. Below 50% it fails.</span></div><div class="rule"><b>Effect</b><span>A failed identity check means the claim can only be rejected. One that needs review needs a reviewer note before approval. Only the last four digits of an ID number are kept, and this demo does not query any government database.</span></div></section>
<section id="r7"><h2>Image screening</h2><p>Each uploaded photo gets a score from 0 to 100. It adds up signals: provenance markers or a named generator in the file metadata, missing camera metadata, sizes common to image generators, very smooth texture and low resolution. Camera and capture-time metadata lower the score. A threshold set by a supervisor decides which scores are flagged. The default is 60.</p><p>Photos are also compared with photos on other claims, so a picture reused across claims is flagged.</p><p><b>What this can and cannot do.</b> This is a screening aid that runs in your browser. It is strong when a file carries provenance markers or generator metadata, and weak otherwise. Modern generators can produce images with no markers, and ordinary photos can lose their metadata when messaging apps strip it. A score is never proof, never changes eligibility or state, and never labels anyone. A production system would add a trained detector running on a server.</p></section>
<section id="r8"><h2>Investigation reports</h2><p>Before a claim can be approved, an adjuster or supervisor files an investigation report while the claim is under review. It records findings, what was reviewed, a recommendation and a recommended payable amount, and it is signed by typing the filer’s name. Every report is written to the ledger. A report is a record, not a decision: the stage change still has to pass every rule.</p></section></div></div>`)};

const RT_RULES={HEALTH:['A 30-day waiting period applies to illness, day-care and maternity claims. Accidents are exempt.','A condition declared as pre-existing must wait 24 months from the policy start.','In-patient claims need a stay of at least 24 hours. Day-care procedures are exempt.','A 10% co-payment applies to every payable claim.','Payment is limited to the total on the hospital bill.','Cosmetic procedures and experimental treatment are excluded.'],VEHICLE:['The claim must name the insured vehicle’s registration number.','The driver’s licence must have been valid on the incident date.','A deductible is subtracted from every repair claim.','Payment is limited to the repair estimate and capped at the sum insured.','A police FIR is needed for theft and third-party claims, and for repair claims above ₹3,00,000.','Racing, drunk driving and intentional damage are excluded.'],HOME:['A surveyor’s report is needed for claims above ₹1,00,000.','Theft claims need a police FIR and a list of stolen items. Fire claims need a fire brigade report.','A sub-limit caps theft payouts, and a deductible applies.','Wear and tear and war are excluded. Flood is excluded here and belongs under flood cover.'],FLOOD:['The event must be documented by a local authority notice or news report, plus a damage assessment.','A surveyor’s report is needed for claims above ₹1,00,000.','A deductible applies to every claim.','War and nuclear risk are excluded.'],TRAVEL:['The incident must fall inside the trip dates. A cancellation must happen before departure.','A flight delay pays only from 6 hours.','Sub-limits cap baggage loss and flight delay payouts.','A ticket or itinerary is needed on every claim.','Pre-planned medical treatment is excluded.'],LIFE:['The benefit is paid to the nominee, so the name on the ID must match the nominee on the policy.','A death within two years of the policy start goes to a reviewer, who checks the original application.','A death certificate, the original policy document and the nominee’s ID are always needed.','Suicide within the first year is excluded.'],ACCIDENT:['Accidental death and total disability pay 100% of the sum insured.','Partial disability pays the stated percentage of the sum insured, taken from the medical certificate.','Injury claims are limited to the bills.','Adventure sports and self-inflicted injury are excluded.']};

V.rules=()=>{const sec=[['r1','How a claim is decided'],['r2','Working out the payout'],['r3','Rules by kind of insurance'],['r4','Required documents'],['r5','Review before approval'],['r6','Duplicates'],['r7','Workflow and authority'],['r8','Narrative analysis'],['r9','Image screening'],['r10','Ledger integrity']];
return`<div class="rb"><nav class="toc" aria-label="Sections">${sec.map(x=>`<button onclick="go2('${x[0]}')">${x[1]}</button>`).join('')}</nav><div>
<section id="r1"><h2>How a claim is decided</h2><p>Rules run in a fixed order and the first failing rule is reported as the one that decided the outcome. The same input always gives the same answer.</p>${[['COVERAGE_PERIOD','The incident date is inside the policy term.'],['FILING_WINDOW','The claim was filed within the policy’s filing window after the incident.'],['EXCLUDED_CATEGORY','What happened is not excluded by the policy.'],['Kind-specific rules','Waiting periods, hospital stay, vehicle and licence match, trip dates, delay hours, disability percentage. See the section on each kind of insurance.'],['REQUIRED_DOCUMENTS','Every required document is attached. This does not make a claim ineligible, but it holds approval until the gap is closed.']].map(r=>`<div class="rule"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</section>
<section id="r2"><h2>Working out the payout</h2><p>An eligible claim is paid in this order, and the workings are shown on every claim.</p>${[['Documented total','Payment is limited to the total on the bill, estimate or assessment.'],['Fixed benefit','Personal accident death and disability pay a share of the sum insured instead.'],['Deductible','Subtracted once from repair and loss claims.'],['Co-payment','The insured’s share of health claims.'],['Sub-limit','A cap for one kind of loss, such as theft or baggage.'],['Sum insured','The final cap. A claim above it is never rejected for that reason; it is paid up to the sum insured.']].map((r,i)=>`<div class="rule"><b>${i+1}. ${r[0]}</b><span>${r[1]}</span></div>`).join('')}<p>The deciding rule is the one that removed the most money.</p></section>
<section id="r3"><h2>Rules by kind of insurance</h2>${TKEYS.map(k=>`<div style="margin:18px 0"><h3 style="display:flex;gap:10px;align-items:center;font-size:16px"><span style="color:var(--brand)">${tIc(k,20)}</span>${TYPES[k].label}</h3><ul style="color:var(--ink2);margin:8px 0;padding-left:20px">${RT_RULES[k].map(x=>`<li style="margin:4px 0">${x}</li>`).join('')}</ul></div>`).join('')}<p>Figures such as the waiting period and deductible are set on each policy. The numbers above are the defaults in the demo data.</p></section>
<section id="r4"><h2>Required documents</h2><div class="tw"><table><thead><tr><th>Kind</th><th>What happened</th><th>Documents</th></tr></thead><tbody>${TKEYS.flatMap(k=>Object.entries(TYPES[k].cats).filter(e=>e[1].docs&&e[1].docs.length>1||k==='LIFE').slice(0,4).map(e=>`<tr><td>${TYPES[k].short}</td><td>${e[0]}</td><td style="white-space:normal;min-width:280px">${e[1].docs.map(d=>Array.isArray(d)?d[0]+' (large claims)':d).join(', ')}</td></tr>`)).join('')}</tbody></table></div><p>Documents can be photos, scans or PDFs. Images are screened, and PDFs are accepted without a score.</p></section>
<section id="r5"><h2>Review before approval</h2><p>These checks do not reject a claim. They stop approval until a reviewer records a note.</p>${[['EARLY_CLAIM','The incident happened within 30 days of the policy start.'],['CLAIM_FREQUENCY','Three or more claims on one policy within a year.'],['HIGH_VALUE','The payable amount is 75% or more of the sum insured.'],['CONTESTABILITY','A life claim within two years of the policy start.'],['IDENTITY','The ID needs review. A failed ID means the claim can only be rejected.'],['DUPLICATE','The same policy, date and kind of loss, even under a different reference.']].map(r=>`<div class="rule"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</section>
<section id="r6"><h2>Duplicates</h2><p>A claim is flagged when it has the same policy, incident date and category as an earlier one, even under a different reference, or when it shares a reference number or a photo with a claim from within three days. A flagged claim cannot be approved or paid until a reviewer marks it distinct. A confirmed duplicate can only be rejected.</p></section>
<section id="r7"><h2>Workflow and authority</h2><div class="tw"><table><thead><tr><th>From</th><th>To</th><th>Who may do it</th><th>Conditions</th></tr></thead><tbody>${TR.map(t=>`<tr><td>${stB(t.from)}</td><td>${stB(t.to)}</td><td>${t.roles.join(' or ')}</td><td style="min-width:260px;white-space:normal">${t.note}</td></tr>`).join('')}</tbody></table></div><p>Any other move is refused: skipping a stage, going backwards, or leaving Rejected or Paid. Submitters and auditors cannot decide. <b>The person who filed a claim can never decide it.</b> An investigation report must be on file before approval. Every accepted decision and every refusal is written to the ledger.</p></section>
<section id="r8"><h2>Narrative analysis</h2><p>The narrative is read for dates, amounts and mentions of excluded events, and compared with the recorded fields. A difference becomes a review prompt. It never changes eligibility or state, and it is not evidence of wrongdoing.</p></section>
<section id="r9"><h2>Image screening</h2><p>Every attached image gets a score from 0 to 100 from metadata markers, size, texture and camera data. Select “How is this scored?” on any claim for the full list of signals. Scores at or above the threshold (default 60, set by a supervisor) are flagged for review. Photos are also compared across claims to catch reuse.</p><p><b>Limits.</b> This is a screening aid in the browser. It is strong when a file carries provenance markers or a generator tag, and weak otherwise. It never changes eligibility or state and never labels anyone. A production system would add a trained detector running on a server.</p></section>
<section id="r10"><h2>Ledger integrity</h2><p>Each entry stores a SHA-256 hash of its own content and of the entry before it. A separate checkpoint stores the latest hash. Verification recomputes the chain, and the bar at the bottom of every page does it continuously. This is tamper-evident, not tamper-proof: in this browser demo, someone able to rewrite all browser storage could rewrite the checkpoint too.</p></section></div></div>`};

if(c&&/document|required|missing|attach/.test(t)){const p=pol(c.policyId),rq=reqDocs(c,p),ms=rq.filter(s=>!hasDoc(c,s));return`${c.id} needs ${rq.length} document${rq.length===1?'':'s'}: ${rq.join(', ')||'none'}. ${ms.length?'Missing: '+ms.join(', ')+'.':'All are attached.'}`}
